name: Build APK Gestore Spese

on:
  workflow_dispatch:
    inputs:
      trigger:
        type: string
        required: false
        description: Avvio manuale della build APK
        default: manual

jobs:
  build_android:
    name: Genera APK Android
    type: build
    params:
      platform: android
      profile: preview
    hooks:
      before_install_node_modules:
        - name: Sincronizza package lock
          run: npm install --package-lock-only --legacy-peer-deps
